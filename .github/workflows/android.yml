name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: Android Lint
        run: ./gradlew lint

      - name: Testes unitários (JVM + Robolectric)
        run: ./gradlew testDebugUnitTest

      - name: Build debug
        run: ./gradlew assembleDebug

      - name: Publicar APK debug
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Keystore de release
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          API_RELEASE_URL: ${{ vars.API_RELEASE_URL }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* && -z "$API_RELEASE_URL" ]]; then
            echo "::error::Variable API_RELEASE_URL ausente: o APK publicado apontaria para 127.0.0.1"
            exit 1
          fi
          ./gradlew assembleRelease

      - name: Publicar APK release
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: GitHub Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # expediente.apk tem nome fixo para o link permanente .../releases/latest/download/expediente.apk
        run: |
          cp app/build/outputs/apk/release/app-release.apk "expediente-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk expediente.apk
          gh release create "$GITHUB_REF_NAME" "expediente-${GITHUB_REF_NAME}.apk" expediente.apk --title "Expediente ${GITHUB_REF_NAME}" --generate-notes

      - name: Publicar relatórios
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
